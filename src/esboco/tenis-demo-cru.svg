<?xml version="1.0" encoding="UTF-8"?>
<!--
  Asset-base CRU do produto de demonstração do esboço.

  É propositalmente "sujo", igual ao que sai de um Illustrator/Figma real:
    - cor do cabedal, dos cadarços e do logo mora num bloco <style> (BUG-001)
    - a entressola tem style inline
    - os 4 cadarços têm o MESMO id (BUG-002 + desambiguação)
    - tem <script>, handler onclick e referência externa (BUG-004)

  O esboço nunca renderiza este arquivo diretamente: renderiza o asset-base canônico que
  `normalizarSvg` devolve. É esse o contrato do ADR-004.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 420 260" width="420" height="260">

  <style>
    .st-cabedal { fill: #E9E4DA; stroke: #C9C2B4; stroke-width: 1.2; }
    .st-sola    { fill: #2E2E33; }
    .st-cadarco { fill: #F5F2EC; }
    .st-logo    { fill: #B23A2E; }
  </style>

  <script>/* fixture: simula export com script embutido, normalizarSvg remove */</script>

  <defs>
    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A8F98"/>
      <stop offset="1" stop-color="#D8DCE2"/>
    </linearGradient>
  </defs>

  <image xlink:href="https://exemplo-externo.invalido/textura.png" x="0" y="0" width="1" height="1"/>

  <ellipse cx="210" cy="242" rx="176" ry="7" fill="#000000" opacity="0.10"/>

